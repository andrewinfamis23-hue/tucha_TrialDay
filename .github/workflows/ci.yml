name: sandbox-ci

on:
  pull_request:
  push:
    branches: [sandbox-main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check addons tests
      - run: python -m compileall -q addons tests
